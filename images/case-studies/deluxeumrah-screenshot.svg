      <text x="301" y="62" font-family="sans-serif" font-size="10" font-weight="700" fill="#D97706">Private Butler • Dedicated Visa Desk</text>

      <rect x="570" y="0" width="265" height="78" rx="8" fill="#F5F5F4" stroke="#E7E5E4" />
      <text x="586" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#1C1917">Ramadan Final 10 Days VIP</text>
      <text x="586" y="44" font-family="sans-serif" font-size="11" fill="#78716C">Swissotel Al Maqam + Oberoi Madinah</text>
      <text x="586" y="62" font-family="sans-serif" font-size="10" font-weight="700" fill="#D97706">Iftar/Suhoor Buffet • Guaranteed Spot</text>
