  </defs>

  <!-- Browser Frame -->
  <rect width="1000" height="625" rx="16" fill="#FBFBFB" />
  <rect width="1000" height="625" rx="16" stroke="#E7E5E4" stroke-width="2" />

  <!-- Top Bar -->
  <rect width="1000" height="52" rx="16" fill="#FFFFFF" />
