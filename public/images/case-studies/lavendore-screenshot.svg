<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <defs>
    <linearGradient id="lavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="perfumeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#D4AF37" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="1000" height="625" rx="16" fill="#09090B" />
  <rect width="1000" height="625" rx="16" stroke="#27272A" stroke-width="2" />

  <!-- Browser Top Bar -->
  <rect width="1000" height="52" rx="16" fill="#18181B" />
  <line x1="0" y1="52" x2="1000" y2="52" stroke="#27272A" stroke-width="1.5" />
  <circle cx="32" cy="26" r="6" fill="#EF4444" />
  <circle cx="52" cy="26" r="6" fill="#F59E0B" />
  <circle cx="72" cy="26" r="6" fill="#10B981" />

  <!-- Address Bar -->
  <rect x="240" y="10" width="520" height="32" rx="16" fill="#27272A" stroke="#3F3F46" stroke-width="1" />
  <path d="M260 21H268V26H260V21ZM262 21V19C262 17.9 262.9 17 264 17C265.1 17 266 17.9 266 19V21" stroke="#D4AF37" stroke-width="1.5" />
  <text x="278" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#F4F4F5">
    https://lavendore.com
  </text>
  <rect x="696" y="16" width="52" height="20" rx="4" fill="#3F3F46" />
  <text x="722" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#D4AF37" text-anchor="middle">LUXURY</text>

  <!-- Luxury Store Top Bar -->
  <rect y="52" width="1000" height="30" fill="#121214" />
  <text x="500" y="71" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D4AF37" letter-spacing="0.1em" text-anchor="middle">
    COMPLIMENTARY DISCOVERY ATOMIZER WITH EVERY CURATED FRAGRANCE • WHITE-GLOVE GCC DELIVERY
  </text>

  <!-- Navigation -->
  <rect y="82" width="1000" height="70" fill="#18181B" />
  <line x1="0" y1="152" x2="1000" y2="152" stroke="#27272A" stroke-width="1" />
  <text x="60" y="125" font-family="'Times New Roman', serif" font-size="28" font-weight="400" letter-spacing="0.25em" fill="#FFFFFF">LAVENDORE</text>
  
  <text x="360" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D4D4D8">ORIENTAL &amp; OUD</text>
  <text x="500" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D4D4D8">NICHE PARFUM</text>
  <text x="630" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D4D4D8">DISCOVERY SETS</text>
  <text x="770" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#D4AF37">SCENT PROFILER</text>

  <!-- Currency / Bag -->
  <text x="910" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">AED / SAR ▾</text>

  <!-- Luxury Hero Showcase -->
  <rect x="48" y="174" width="904" height="270" rx="16" fill="url(#lavGrad)" stroke="#27272A" />
  <g transform="translate(90, 220)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="0.2em" fill="#D4AF37">HAUTE PARFUMERIE</text>
    <text x="0" y="65" font-family="'Times New Roman', serif" font-size="38" font-weight="400" letter-spacing="0.04em" fill="#FFFFFF">Pure Oud &amp; Velvet Amber Noir</text>
    <text x="0" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#A1A1AA" max-width="500">
      Distilled from rare Cambodian agarwood, aged Moroccan rose, and warm amber resin.
    </text>

    <!-- Olfactory Pyramid Preview -->
    <g transform="translate(0, 120)">
      <rect width="105" height="28" rx="14" fill="#27272A" stroke="#3F3F46" />
      <text x="52" y="138" font-family="sans-serif" font-size="10" font-weight="600" fill="#D4AF37" text-anchor="middle">Top: Bergamot</text>

      <rect x="115" y="0" width="105" height="28" rx="14" fill="#27272A" stroke="#3F3F46" />
      <text x="167" y="18" font-family="sans-serif" font-size="10" font-weight="600" fill="#D4AF37" text-anchor="middle">Heart: Taif Rose</text>

      <rect x="230" y="0" width="105" height="28" rx="14" fill="#27272A" stroke="#3F3F46" />
      <text x="282" y="18" font-family="sans-serif" font-size="10" font-weight="600" fill="#D4AF37" text-anchor="middle">Base: Dark Oud</text>
    </g>

    <g transform="translate(0, 166)">
      <rect width="180" height="42" rx="21" fill="url(#goldSheen)" />
      <text x="90" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="0.08em" fill="#000000" text-anchor="middle">ACQUIRE FLACON • 100ML</text>
      <text x="200" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#A1A1AA">or 4 interest-free payments with Tabby</text>
    </g>
  </g>

  <!-- Illustrated Perfume Bottle Visual -->
  <g transform="translate(740, 205)" filter="url(#perfumeGlow)">
    <!-- Heavy Glass Flacon -->
    <rect x="40" y="70" width="110" height="145" rx="8" fill="#18181B" stroke="url(#goldSheen)" stroke-width="2.5" />
    <rect x="52" y="82" width="86" height="121" fill="#09090B" />
    <!-- Label Inset -->
    <rect x="62" y="110" width="66" height="66" fill="#18181B" stroke="#D4AF37" stroke-width="1" />
    <text x="95" y="135" font-family="serif" font-size="8" letter-spacing="0.1em" fill="#FFFFFF" text-anchor="middle">LAVENDORE</text>
    <text x="95" y="150" font-family="sans-serif" font-size="7" font-weight="700" fill="#D4AF37" text-anchor="middle">OUD NOIR</text>
    <text x="95" y="162" font-family="sans-serif" font-size="6" fill="#A1A1AA" text-anchor="middle">EXTRAIT</text>
    <!-- Gold Cap & Neck -->
    <rect x="75" y="42" width="40" height="28" rx="4" fill="url(#goldSheen)" />
    <rect x="85" y="32" width="20" height="10" fill="#3F3F46" />
  </g>

  <!-- Curated Collection Carousel Preview -->
  <g transform="translate(48, 464)">
    <rect width="904" height="135" rx="14" fill="#18181B" stroke="#27272A" />
    <text x="32" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#D4AF37">CURATED PRIVATE ARCHIVES</text>
    
    <g transform="translate(32, 50)">
      <rect x="0" y="0" width="260" height="65" rx="8" fill="#27272A" />
      <circle cx="35" cy="32" r="18" fill="#18181B" stroke="#D4AF37" />
      <text x="65" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Amber Imperial 50ml</text>
      <text x="65" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A1A1AA">Warm resin • AED 640</text>

      <rect x="280" y="0" width="260" height="65" rx="8" fill="#27272A" />
      <circle cx="315" cy="32" r="18" fill="#18181B" stroke="#D4AF37" />
      <text x="345" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Taif Rose Damascena</text>
      <text x="345" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A1A1AA">Precious florals • AED 720</text>

      <rect x="560" y="0" width="280" height="65" rx="8" fill="#27272A" />
      <circle cx="595" cy="32" r="18" fill="#18181B" stroke="#D4AF37" />
      <text x="625" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Discovery Coffret (6 x 5ml)</text>
      <text x="625" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A1A1AA">Complete wardrobe • AED 290</text>
    </g>
  </g>
</svg>
