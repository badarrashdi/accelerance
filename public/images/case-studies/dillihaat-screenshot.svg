    <text x="80" y="258" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order Online &rarr;</text>

    <rect x="180" y="230" width="160" height="46" rx="23" fill="transparent" stroke="#78350F" stroke-width="1.5" />
    <text x="260" y="258" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reserve Table</text>
  </g>

  <!-- Right Hero Visual Card -->
  <g transform="translate(560, 160)">
    <rect width="380" height="410" rx="20" fill="#292524" stroke="#44403C" stroke-width="1.5" />
