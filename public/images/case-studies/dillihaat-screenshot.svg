    <rect x="24" y="24" width="332" height="150" rx="14" fill="#1C1917" />
    <text x="44" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">CHEF'S SIGNATURE</text>
    <text x="44" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Dilli's Butter Chicken</text>
    <text x="44" y="118" font-family="sans-serif" font-size="12" fill="#A8A29E">Slow-cooked tender chicken in velvet tomato-fenugreek gravy</text>
    <text x="44" y="150" font-family="sans-serif" font-size="16" font-weight="800" fill="#F59E0B">£12.95</text>
    <rect x="250" y="130" width="90" height="30" rx="15" fill="#F59E0B" />
    <text x="295" y="150" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>

    <!-- Grid items -->
    <rect x="24" y="195" width="158" height="185" rx="12" fill="#1C1917" />
    <text x="40" y="230" font-family="sans-serif" font-size="11" font-weight="700" fill="#F59E0B">STARTER</text>
    <text x="40" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Amritsari Kulcha</text>
    <text x="40" y="290" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">£5.50</text>
    <rect x="40" y="325" width="126" height="30" rx="8" fill="#F59E0B" />
    <text x="103" y="345" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order</text>

    <rect x="198" y="195" width="158" height="185" rx="12" fill="#1C1917" />
    <text x="214" y="230" font-family="sans-serif" font-size="11" font-weight="700" fill="#F59E0B">TANDOOR</text>
    <text x="214" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Seekh Kebab</text>
    <text x="214" y="290" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">£7.95</text>
    <rect x="214" y="325" width="126" height="30" rx="8" fill="#F59E0B" />
    <text x="277" y="345" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order</text>
  </g>
</svg>
