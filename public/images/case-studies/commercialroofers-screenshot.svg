    <rect x="16" y="176" width="208" height="34" rx="6" fill="#0F172A" />
    <text x="120" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Calculate Budget Estimate</text>
