      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Eastern Creek Logistics Hub</text>
      <text x="16" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">14,000m² Colorbond Re-Roof</text>
      <text x="16" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D">Completed On-Schedule • Zero Downtime</text>

      <rect x="285" y="0" width="265" height="78" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
