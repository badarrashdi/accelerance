      <text x="301" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Architectural Cladding &amp; Drainage</text>
      <text x="301" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D">SafeWork Compliance Audited</text>

      <rect x="570" y="0" width="265" height="78" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="586" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Mascot Air Cargo Facility</text>
      <text x="586" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Aviation Grade Waterproofing</text>
      <text x="586" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803D">25-Year Platinum Guarantee</text>
