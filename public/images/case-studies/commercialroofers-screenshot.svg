    <text x="50" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A">COMMERCIAL<tspan fill="#F59E0B">ROOFERS</tspan></text>
    <text x="50" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="0.12em" fill="#64748B">AUSTRALIA • NSW</text>
