    <rect x="16" y="16" width="208" height="28" rx="6" fill="#F1F5F9" />
    <text x="120" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">COMMERCIAL ESTIMATOR</text>
    
    <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B">ROOF AREA (SQM)</text>
